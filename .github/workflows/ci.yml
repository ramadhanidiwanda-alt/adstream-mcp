name: CI

on:
  pull_request:
    branches: [main]

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # Covers src and scripts. tests/ is checked by `npm run typecheck:tests`,
      # which is not gated yet: it still reports a backlog of type errors that
      # accumulated while nothing checked that directory at all.
      - name: Type check
        run: npm run typecheck

      - name: Build package entrypoint
        run: npm run build

      - name: Unit tests
        run: npm test

  gitleaks:
    name: Secret scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
