name: CI

on:
  pull_request:
    branches: [main]

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # typecheck covers src and scripts; typecheck:tests adds tests/ on top of
      # src. Both are gated: the tests/ backlog that built up while nothing
      # checked that directory is cleared, and keeping it gated is what stops it
      # coming back.
      - name: Type check
        run: npm run typecheck

      - name: Type check tests
        run: npm run typecheck:tests

      - name: Build package entrypoint
        run: npm run build

      - name: Unit tests
        run: npm test

  gitleaks:
    name: Secret scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
